<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <title>Hack Me — Challenge Coming Soon | Jhapendra Kandel</title>
    <meta name="description"
        content="A capture-the-flag style honeypot challenge by Jhapendra Kandel. Not live yet. Drop your email and get pinged the moment it goes online.">
    <meta name="author" content="Jhapendra Kandel">
    <link rel="canonical" href="https://www.jhapendrakandel.com.np/hack-me/">

    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/jhapendrakandel/Jace.github.io/refs/heads/main/logo.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Hack Me — Challenge Coming Soon">
    <meta property="og:description"
        content="A CTF style honeypot challenge. Not live yet. Stay alerted.">
    <meta property="og:url" content="https://www.jhapendrakandel.com.np/hack-me/">
    <meta property="og:image"
        content="https://raw.githubusercontent.com/jhapendrakandel/Jace.github.io/refs/heads/main/logo.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #04070a;
            --green: #00ff9c;
            --green-dim: #0c8f5c;
            --cyan: #22d3ee;
            --magenta: #ff2bd6;
            --amber: #ffb000;
            --text: #b9ffe4;
            --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100svh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 48px);
            position: relative;
        }

        /* ---- matrix rain canvas ---- */
        #matrix {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
        }

        /* ---- CRT scanlines + vignette ---- */
        .fx {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .fx.scan {
            background: repeating-linear-gradient(to bottom,
                    rgba(0, 0, 0, 0) 0px,
                    rgba(0, 0, 0, 0) 2px,
                    rgba(0, 0, 0, 0.28) 3px,
                    rgba(0, 0, 0, 0) 4px);
            animation: scanmove 8s linear infinite;
        }

        .fx.vignette {
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
        }

        @keyframes scanmove {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            48% { opacity: 1; }
            50% { opacity: 0.82; }
            52% { opacity: 1; }
            70% { opacity: 0.93; }
        }

        /* ---- main shell ---- */
        .wrap {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 720px;
            animation: flicker 6s infinite;
        }

        .tag {
            font-size: clamp(0.7rem, 2.6vw, 0.85rem);
            letter-spacing: 0.35em;
            color: var(--green-dim);
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .glitch {
            font-family: "VT323", var(--mono);
            font-size: clamp(3.2rem, 16vw, 7rem);
            line-height: 0.9;
            margin: 0;
            color: var(--green);
            text-shadow: 0 0 8px rgba(0, 255, 156, 0.55), 0 0 28px rgba(0, 255, 156, 0.25);
            position: relative;
            letter-spacing: 0.02em;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            overflow: hidden;
        }

        .glitch::before {
            color: var(--magenta);
            animation: glitchTop 2.7s infinite linear alternate-reverse;
            clip-path: inset(0 0 55% 0);
        }

        .glitch::after {
            color: var(--cyan);
            animation: glitchBot 3.4s infinite linear alternate-reverse;
            clip-path: inset(55% 0 0 0);
        }

        @keyframes glitchTop {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-3px, -1px); }
            40% { transform: translate(2px, 1px); }
            60% { transform: translate(-2px, 0); }
            80% { transform: translate(3px, -1px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes glitchBot {
            0% { transform: translate(0, 0); }
            25% { transform: translate(2px, 1px); }
            50% { transform: translate(-3px, 0); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* ---- terminal ---- */
        .term {
            margin-top: 26px;
            border: 1px solid rgba(0, 255, 156, 0.35);
            border-radius: 6px;
            background: rgba(2, 12, 9, 0.72);
            box-shadow: 0 0 30px rgba(0, 255, 156, 0.08), inset 0 0 40px rgba(0, 255, 156, 0.04);
            backdrop-filter: blur(2px);
            overflow: hidden;
        }

        .term-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0, 255, 156, 0.07);
            border-bottom: 1px solid rgba(0, 255, 156, 0.22);
            font-size: 0.72rem;
            color: var(--green-dim);
            letter-spacing: 0.15em;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1d2a25;
            border: 1px solid rgba(0, 255, 156, 0.4);
        }

        .dot.r { background: #ff5f56; border-color: #ff5f56; }
        .dot.y { background: var(--amber); border-color: var(--amber); }
        .dot.g { background: var(--green); border-color: var(--green); }

        .term-body {
            padding: 16px clamp(12px, 3vw, 22px);
            font-size: clamp(0.82rem, 3.2vw, 0.98rem);
            line-height: 1.7;
            min-height: 190px;
        }

        .term-body .line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .term-body .ok { color: var(--green); }
        .term-body .warn { color: var(--amber); }
        .term-body .err { color: var(--magenta); }
        .term-body .muted { color: #4f7a6b; }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 1.05em;
            background: var(--green);
            vertical-align: -2px;
            margin-left: 2px;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ---- notify form ---- */
        .notify {
            margin-top: 24px;
        }

        .notify p {
            margin: 0 0 12px;
            color: #6ee7b7;
            font-size: clamp(0.82rem, 3vw, 0.95rem);
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .notify input[type="email"] {
            flex: 1 1 220px;
            min-width: 0;
            background: rgba(0, 20, 14, 0.7);
            border: 1px solid rgba(0, 255, 156, 0.4);
            color: var(--green);
            font-family: var(--mono);
            font-size: 0.95rem;
            padding: 13px 14px;
            border-radius: 4px;
            outline: none;
        }

        .notify input[type="email"]::placeholder {
            color: #3f6e5d;
        }

        .notify input[type="email"]:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 2px rgba(0, 255, 156, 0.15), 0 0 18px rgba(0, 255, 156, 0.25);
        }

        .notify button {
            flex: 0 0 auto;
            cursor: pointer;
            background: var(--green);
            color: #02120c;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 13px 22px;
            border: none;
            border-radius: 4px;
            transition: box-shadow 0.2s, transform 0.05s;
        }

        .notify button:hover {
            box-shadow: 0 0 22px rgba(0, 255, 156, 0.55);
        }

        .notify button:active {
            transform: translateY(1px);
        }

        .foot {
            margin-top: 26px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px 22px;
            align-items: center;
            font-size: 0.8rem;
            color: #4f7a6b;
        }

        .foot a {
            color: var(--cyan);
            text-decoration: none;
        }

        .foot a:hover {
            text-decoration: underline;
        }

        .pulse {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--amber);
        }

        .pulse::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 0 0 rgba(255, 176, 0, 0.7);
            animation: ring 1.8s infinite;
        }

        @keyframes ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 176, 0, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(255, 176, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 176, 0, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .glitch::before,
            .glitch::after,
            .fx.scan,
            .wrap,
            .cursor,
            .pulse::before {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrix"></canvas>
    <div class="fx scan"></div>
    <div class="fx vignette"></div>

    <main class="wrap">
        <div class="tag">// jhapendrakandel.com.np / security-lab</div>
        <h1 class="glitch" data-text="HACK ME">HACK ME</h1>

        <section class="term" aria-label="System status">
            <div class="term-bar">
                <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
                <span>root@honeypot: ~ /challenge</span>
            </div>
            <div class="term-body" id="termBody"></div>
        </section>

        <form class="notify" id="notifyForm" method="POST"
            action="https://formsubmit.co/jhapendrakandel.mac@gmail.com">
            <p>Challenge is offline. Leave your email and get one message the day it drops.</p>
            <div class="row">
                <input type="email" name="email" placeholder="you@domain.tld" required autocomplete="email">
                <button type="submit">&gt; notify_me</button>
            </div>
            <input type="hidden" name="_subject" value="hack-me challenge — alert signup">
            <input type="hidden" name="_next" value="https://www.jhapendrakandel.com.np/thanks.html">
            <input type="hidden" name="_template" value="table">
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        </form>

        <div class="foot">
            <span class="pulse">STATUS: COMING SOON</span>
            <a href="/">&larr; back to main site</a>
            <a href="/blog/">read the blog</a>
        </div>
    </main>

    <script>
        /* ---------- matrix rain ---------- */
        (function () {
            var c = document.getElementById("matrix");
            var ctx = c.getContext("2d");
            var chars = "01<>{}[]#$%&/ABCDEFGHJKLMNPQRSTUVWXYZ".split("");
            var fontSize = 14;
            var cols, drops;

            function resize() {
                c.width = window.innerWidth;
                c.height = window.innerHeight;
                cols = Math.floor(c.width / fontSize);
                drops = new Array(cols).fill(1).map(function () {
                    return Math.floor(Math.random() * -50);
                });
            }
            resize();
            window.addEventListener("resize", resize);

            var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            function draw() {
                ctx.fillStyle = "rgba(4, 7, 10, 0.08)";
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.fillStyle = "#00ff9c";
                ctx.font = fontSize + "px monospace";
                for (var i = 0; i < drops.length; i++) {
                    var txt = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(txt, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > c.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            if (!reduce) {
                setInterval(draw, 55);
            }
        })();

        /* ---------- terminal boot typing ---------- */
        (function () {
            var target = document.getElementById("termBody");
            var lines = [
                { t: "$ ./init_challenge --env prod", cls: "" },
                { t: "[  ok  ] spinning up isolated honeypot container", cls: "ok" },
                { t: "[  ok  ] loading trap set: web / auth / recon", cls: "ok" },
                { t: "[ warn ] public endpoint not yet exposed", cls: "warn" },
                { t: "[ fail ] scoreboard service :: OFFLINE", cls: "err" },
                { t: "", cls: "" },
                { t: "> challenge build ..... 87% complete", cls: "muted" },
                { t: "> deploy window ....... SOON", cls: "muted" },
                { t: "", cls: "" },
                { t: "MESSAGE: A CTF-style honeypot is being built here.", cls: "ok" },
                { t: "         Your job will be to break in, escalate,", cls: "ok" },
                { t: "         and capture the flag. Stay alerted.", cls: "ok" }
            ];

            var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var li = 0;

            function addCursorTo(el) {
                var cur = document.createElement("span");
                cur.className = "cursor";
                el.appendChild(cur);
            }

            if (reduce) {
                lines.forEach(function (ln) {
                    var d = document.createElement("div");
                    d.className = "line " + ln.cls;
                    d.textContent = ln.t || " ";
                    target.appendChild(d);
                });
                addCursorTo(target.lastChild);
                return;
            }

            function typeLine() {
                if (li >= lines.length) {
                    addCursorTo(target.lastChild);
                    return;
                }
                var ln = lines[li];
                var d = document.createElement("div");
                d.className = "line " + ln.cls;
                target.appendChild(d);
                var i = 0;
                var speed = ln.t.length > 30 ? 12 : 22;
                (function step() {
                    d.textContent = ln.t.slice(0, i);
                    i++;
                    if (i <= ln.t.length) {
                        setTimeout(step, speed);
                    } else {
                        if (!ln.t) d.innerHTML = " ";
                        li++;
                        setTimeout(typeLine, 180);
                    }
                })();
            }
            typeLine();
        })();

        /* ---------- basic bot guard ---------- */
        document.getElementById("notifyForm").addEventListener("submit", function (e) {
            if (this._honey.value !== "") {
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
