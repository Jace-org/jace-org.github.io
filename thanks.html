<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d10">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <title>Message sent — Jhapendra Kandel</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/jhapendrakandel/Jace.github.io/refs/heads/main/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d10;
            --surface: #17171f;
            --border: #2a2a36;
            --text: #ececf1;
            --text-dim: #a1a1ad;
            --accent: #ff6363;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fbfbfd;
                --surface: #fff;
                --border: #e4e4ec;
                --text: #1a1a22;
                --text-dim: #5b5b68;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", system-ui, sans-serif;
        }

        .card {
            max-width: 460px;
            width: 100%;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 46px 34px;
        }

        .check {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            display: block;
        }

        .check circle {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: stroke .6s cubic-bezier(.65, 0, .45, 1) forwards;
        }

        .check path {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke .35s cubic-bezier(.65, 0, .45, 1) .6s forwards;
        }

        @keyframes stroke { to { stroke-dashoffset: 0; } }

        h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.5rem;
            margin: 0 0 10px;
        }

        p {
            color: var(--text-dim);
            margin: 0 0 26px;
            line-height: 1.6;
        }

        a.btn {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #ff6363, #ff8a5c);
        }

        @media (prefers-reduced-motion: reduce) {
            .check circle, .check path { animation: none; stroke-dashoffset: 0; }
        }
    </style>
</head>

<body>
    <div class="card">
        <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="25" />
            <path d="M14 27l8 8 16-17" />
        </svg>
        <h1>Message sent</h1>
        <p>Thanks for reaching out — your message has been received. I'll get back to you soon.</p>
        <a class="btn" href="/">Back to home</a>
    </div>
</body>

</html>
