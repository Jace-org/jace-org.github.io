<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <title>Message sent — Jhapendra Kandel</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/jhapendrakandel/Jace.github.io/refs/heads/main/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #111111;
            --surface: #1b1b1b;
            --line: #333333;
            --ink: #ffffff;
            --muted: #a6a6a6;
            --yellow: #ffd60a;
            --mint: #6ff2c8;
            --on-light: #111111;
            --ease: cubic-bezier(.2, .7, .1, 1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--ink);
            font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
            line-height: 1.55;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--yellow); color: var(--on-light); }
        :focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; border-radius: 4px; }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--mint);
            color: var(--on-light);
            border-radius: 28px;
            padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 44px);
            animation: pop .7s var(--ease) backwards;
        }
        @keyframes pop { from { opacity: 0; transform: translateY(22px) rotate(-1deg); } }

        .check { width: 72px; height: 72px; margin: 0 0 24px; display: block; }
        .check circle {
            fill: none; stroke: var(--on-light); stroke-width: 2.4;
            stroke-dasharray: 166; stroke-dashoffset: 166;
            animation: stroke .6s cubic-bezier(.65, 0, .45, 1) .15s forwards;
        }
        .check path {
            fill: none; stroke: var(--on-light); stroke-width: 3;
            stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 48; stroke-dashoffset: 48;
            animation: stroke .35s cubic-bezier(.65, 0, .45, 1) .75s forwards;
        }
        @keyframes stroke { to { stroke-dashoffset: 0; } }

        .mono {
            font-stretch: 62%; font-weight: 900; font-size: 1.5rem; line-height: 1;
            letter-spacing: .02em; margin: 0 0 14px;
        }

        h1 {
            font-stretch: 62%; font-weight: 900; text-transform: uppercase;
            font-size: clamp(3.5rem, 2rem + 8vw, 6rem); line-height: .86; letter-spacing: -.01em;
            margin: 0 0 16px;
        }
        p { margin: 0 0 28px; font-weight: 600; font-size: 1.0625rem; max-width: 36ch; }
        .mono { margin-bottom: 14px; }

        a.btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 52px; padding: 0 28px; border-radius: 999px;
            font-weight: 700; text-decoration: none;
            background: var(--on-light); color: var(--ink);
            transition: transform .25s var(--ease), background-color .25s, color .25s;
        }
        a.btn:hover { transform: translateY(-3px); background: var(--yellow); color: var(--on-light); }
        a.btn:active { transform: translateY(1px) scale(.97); }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
            .check circle, .check path { animation: none; stroke-dashoffset: 0; }
            a.btn { transition: none; }
        }
    </style>
</head>

<body>
    <div class="card">
        <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="25" />
            <path d="M14 27l8 8 16-17" />
        </svg>
        <p class="mono">J.K</p>
        <h1>Message sent</h1>
        <p>Thanks for reaching out — your message has been received. I'll get back to you soon.</p>
        <a class="btn" href="/">Back to home</a>
    </div>
</body>

</html>
