<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Static site starter</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #16181d;
            --muted: #5b616e;
            --accent: #d4af37;
            --card: #f4f5f7;
            --border: #e3e5ea;
        }

        html.dark {
            --bg: #0f172a;
            --text: #e6e8ec;
            --muted: #99a1b3;
            --card: #1b2333;
            --border: #2a3346;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .3s, color .3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }

        .brand { font-weight: 700; letter-spacing: .02em; }

        button {
            font: inherit;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
        }

        main { max-width: 720px; margin: 0 auto; padding: 56px 24px; }

        h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 12px; }

        p.lead { color: var(--muted); font-size: 1.1rem; }

        .card {
            margin-top: 28px;
            padding: 24px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        a { color: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
    <script>
        try {
            if (localStorage.getItem("theme") === "light") document.documentElement.classList.remove("dark");
        } catch (e) { }
    </script>
</head>

<body>
    <header>
        <span class="brand">Your Name</span>
        <button id="theme">Toggle theme</button>
    </header>

    <main>
        <h1>Static site starter</h1>
        <p class="lead">One HTML file. Dark and light theme with the choice remembered. No framework, no build step.
            Drop it on GitHub Pages and go.</p>

        <div class="card">
            <h2>Next steps</h2>
            <ul>
                <li>Replace this copy with your own.</li>
                <li>Split the CSS into its own file once it grows.</li>
                <li>Add sections, keep it fast.</li>
            </ul>
        </div>
    </main>

    <script>
        var root = document.documentElement;
        document.getElementById("theme").addEventListener("click", function () {
            root.classList.toggle("dark");
            try {
                localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
            } catch (e) { }
        });
    </script>
</body>

</html>
